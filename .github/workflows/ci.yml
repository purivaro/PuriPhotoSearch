name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Frontend — types, unit tests, production bundle
        run: |
          pnpm typecheck
          pnpm test
          pnpm exec vite build
      - name: Rust — format, lint, tests
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      # การทดสอบแอปจริง (e2e/run.sh) บน macOS ต้องมี window server จึงรันในเครื่องเท่านั้น — ดู docs/TEST_REPORT.md

  # Windows ไม่มีเครื่องทดสอบของเราเอง: runner นี้คือที่เดียวที่โค้ดฝั่ง Windows ถูกรันจริง
  # จึงรันทั้งเทสต์ Rust และแอปจริงในหน้าต่าง WebView2 (e2e) ที่นี่
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # เปลือก Tauri ต้องมี dist ตอน compile
      - name: Frontend — production bundle
        run: pnpm exec vite build
      - name: Rust — lint, tests
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast
      - name: แอปจริงในหน้าต่าง WebView2 (e2e)
        if: ${{ !cancelled() }}
        run: |
          pnpm tauri build --debug --no-bundle
          # โฟลเดอร์ชั่วคราวของ runner เอง: %TEMP% ของผู้ใช้เป็นชื่อสั้นแบบ 8.3 ซึ่งไม่ตรงกับ path ที่แอปแสดง
          export TMPDIR="$(cygpath -u "$RUNNER_TEMP")"
          APP="$PWD/target/debug/puri-photo-search.exe" e2e/run.sh
      # ONNX Runtime + โมเดลจริงบน Windows: ชุดโมเดลและรูปตัวอย่าง (คนหกคน) มาจาก repo ของ InsightFace เอง
      - uses: actions/cache@v4
        if: ${{ !cancelled() }}
        with:
          path: face-check/models
          key: buffalo_l-v0.7
      - name: ตัววิเคราะห์ใบหน้าจริง (buffalo_l)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p face-check/models face-check/photos
          if [ ! -f face-check/models/w600k_r50.onnx ]; then
            curl --fail -sSL -o face-check/buffalo_l.zip https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
            "$SYSTEMROOT/System32/tar.exe" -xf face-check/buffalo_l.zip -C face-check/models det_10g.onnx w600k_r50.onnx
            rm face-check/buffalo_l.zip
          fi
          curl --fail -sSL -o face-check/photos/a.jpg https://raw.githubusercontent.com/deepinsight/insightface/master/python-package/insightface/data/images/t1.jpg
          cp face-check/photos/a.jpg face-check/photos/b.jpg
          out=$(cargo run -q -p puri-faces --example bench -- face-check/models face-check/photos 2 2)
          echo "$out"
          # รูปแรกเป็นรอบอุ่นเครื่อง ตัวเลขมาจากรูปที่สอง: ต้องพบใบหน้า
          case "$out" in *"(0.0 ใบหน้า/รูป"*) echo "ไม่พบใบหน้าในรูปตัวอย่าง"; exit 1 ;; esac
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-e2e-report
          path: target/e2e-report.json
          if-no-files-found: ignore
