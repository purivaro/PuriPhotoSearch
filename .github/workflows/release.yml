# Build the download and attach it to the GitHub Release for the tag.
# The asset names must stay stable: README and release notes point to PuriPhotoSearch-mac.dmg
# and PuriPhotoSearch-windows-setup.exe.
# Signing needs the repository secrets written by scripts/setup-release-secrets.sh.
# Run by hand (workflow_dispatch), or open a PR that changes this file, to build
# without publishing; the file is then only kept as a workflow artifact.
#
# Windows: an NSIS installer for x64, not code-signed (no Windows certificate), so SmartScreen warns on first run.
# It is exercised only on GitHub's Windows runner (ci.yml) — see docs/TEST_REPORT.md. No Linux build.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Signing and notarization are optional: without the secrets (fork PRs, or
      # before they are added) the app is only ad-hoc signed, which keeps the
      # bundle's seal valid but does not satisfy Gatekeeper (README, "Install").
      # Only non-empty values reach Tauri, which would otherwise try to use them.
      - name: Set up signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::No signing secrets; building an ad-hoc signed app."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          # Own keychain (Tauri's temporary one is gone after the build, and the
          # DMG is signed after that).
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -f pkcs12 -A -T /usr/bin/codesign \
            -P "$APPLE_CERTIFICATE_PASSWORD"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_SIGNED=1" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
          else
            echo "::warning::No notarization secrets; the app is signed but not notarized."
          fi
      - name: Build universal app
        run: pnpm tauri build --target universal-apple-darwin
      - name: Collect
        run: |
          mkdir -p out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg out/PuriPhotoSearch-mac.dmg
          codesign --verify --deep --strict --verbose=2 "target/universal-apple-darwin/release/bundle/macos/Puri Photo Search.app"
          lipo -archs "target/universal-apple-darwin/release/bundle/macos/Puri Photo Search.app/Contents/MacOS/puri-photo-search"
      # Tauri notarizes and staples the .app; the DMG around it gets its own
      # signature and ticket so Gatekeeper accepts the download itself.
      - name: Sign, notarize and check DMG
        if: env.DEVELOPER_ID_SIGNED == '1'
        run: |
          dmg=out/PuriPhotoSearch-mac.dmg
          app="target/universal-apple-darwin/release/bundle/macos/Puri Photo Search.app"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          if [ -z "$APPLE_ID" ]; then exit 0; fi
          xcrun stapler validate "$app"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t install "$dmg"
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm tauri build
      - name: Collect
        run: |
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe out/PuriPhotoSearch-windows-setup.exe
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum PuriPhotoSearch-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PuriPhotoSearch-* SHA256SUMS.txt --clobber
          else
            # A tag with a suffix (v0.2.0-rc1) becomes a pre-release, so it
            # never takes over the releases/latest download link.
            pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
            gh release create "$TAG" PuriPhotoSearch-* SHA256SUMS.txt --title "Puri Photo Search ${TAG#v}" --generate-notes $pre
          fi
