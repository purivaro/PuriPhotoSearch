[package]
name = "puri-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# ต้นแบบวัดความเร็วตัวอย่างสด (exp/preview-wasm)
rayon = "1.12.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
kamadak-exif = "0.6.2"
# ไฟล์ RAW จากกล้อง (DECISIONS ข้อ 25) — pure Rust, LGPL-2.1 (repo นี้เปิด source จึงสร้างใหม่กับ rawler ที่แก้เองได้)
rawler = "0.8.0"
libc = "0.2.191"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.3", features = ["v4", "v7"] }
walkdir = "2.5.0"

# ย้ายต้นฉบับไปถังขยะเมื่อผู้ใช้สั่งย่อไฟล์ในที่เดิม (platform::move_to_trash)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
trash = { version = "5.4.0", default-features = false, features = ["coinit_apartmentthreaded"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
