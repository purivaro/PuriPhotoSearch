[workspace]
members = ["crates/core", "crates/devbridge", "crates/faces", "src-tauri"]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.10"
edition = "2021"
rust-version = "1.89"
publish = false

[profile.dev]
debug = "line-tables-only"

# Image decoding in an unoptimised build is ~20x slower; keep dependencies fast.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
